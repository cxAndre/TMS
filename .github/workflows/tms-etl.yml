name: TMS ETL

# Roda automaticamente por agendamento + botão manual.
on:
  schedule:
    # Cron em UTC. Brasil = UTC-3. '0 * * * *' = de hora em hora.
    # Exemplos: '0 */2 * * *' a cada 2h | '0 9-21 * * *' das 6h às 18h BRT.
    - cron: '0 * * * *'
  workflow_dispatch:      # permite rodar na mão pela aba Actions
    inputs:
      janela_dias:
        description: 'Backfill: janela do Protheus em dias (vazio = padrão). Ex.: 230 = desde o começo do ano.'
        required: false
        default: ''

# Evita duas execuções simultâneas (o worker já barra, isto é reforço).
concurrency:
  group: tms-etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Instalar Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Recriar .env a partir do secret
        run: |
          cat > .env <<'DOTENV_EOF'
          ${{ secrets.DOTENV }}
          DOTENV_EOF

      - name: Rodar ETL
        env:
          # dotenv não sobrescreve o que já está no ambiente, então estes vencem.
          PVN_SFTP_HOST: 31.97.23.238
          PVN_SFTP_USER: pvn
          PVN_SFTP_KEY: ${{ secrets.PVN_SFTP_KEY }}
          # Runner do GitHub tem rota mais lenta até o Protheus que a máquina local:
          # a query do ACERTA/ESL estoura o requestTimeout padrão de 60s. Sobe p/ 300s.
          MSSQL_REQ_TIMEOUT: '300000'
          # Backfill sob demanda: só preenchido quando disparado na mão com valor.
          # Vazio (runs agendados) → worker usa o JANELA_DIAS do secret.
          JANELA_DIAS_OVERRIDE: ${{ github.event.inputs.janela_dias }}
        run: npm start
